{% extends 'base.html' %}
{% block body %}


  <!-- FORM -->
  <div class="container my-3">
        <h2>DEMO</h2>
    <form action="/" method="POST">
    <div class="mb-3">
      <label for="title"  class="form-label">Demo Title</label>
      <input type="text" name="title" class="form-control" id="title" aria-describedby="emailHelp">
    </div>
    <div class="mb-3">
      <label for="desc" class="form-label">Description</label>
      <input type="text" name = "desc" class="form-control" id="desc">
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
      <a href="/ai" type="button" class="btn btn-primary">GPT</a>

  </form>
  </div>

  <!-- TABLE -->
  <div class="container my-3">
       {% if all_demo|length==0 %}
    <div class="alert alert-dark" role="alert">
      no record found
    </div>
      {% else %}

      <table class="table">

        <thead>
        <tr>
          <th scope="col">Serial</th>
          <th scope="col">Title</th>
          <th scope="col">Description</th>
          <th scope="col">Time</th>
          <th scope="col">Actions</th>

        </tr>
        </thead>
        {% for todo in all_demo %}

        <tbody>

        <tr>
          <th scope="row">{{loop.index}}</th>
          <td>{{todo.title}}</td>
          <td>{{todo.desc}}</td>
          <td>@{{todo.date_created}}</td>
          <td><a href="/update/{{todo.serial}}" type="button" class="btn btn-info btn-sm mx-1">Update</a>
            <a href="/delete/{{todo.serial}}" type="button" class="btn btn-info btn-sm mx-1 ">Delete</a></td>
        </tr>
        </tbody>
              {% endfor %}

      </table>
      {% endif %}

  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
{% endblock body %}
