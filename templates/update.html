{% extends 'base.html' %}
{% block body %}


  <!-- FORM -->
  <div class="container my-3">
      <h2>UPDATE DEMO</h2>

    <form action="/update/{{todo.serial}}" method="POST">
    <div class="mb-3">
      <label for="title"  class="form-label">Demo Title</label>
      <input type="text" name="title" class="form-control" id="title" aria-describedby="emailHelp" value="{{todo.title}}">
    </div>
    <div class="mb-3">
      <label for="desc" class="form-label">Description</label>
      <input type="text" name = "desc" class="form-control" id="desc" value="{{todo.desc}}">
    </div>
    <button type="submit" class="btn btn-dark">Update</button>
  </form>
  </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
{% endblock body %}
