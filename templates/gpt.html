{% extends 'base.html' %}
{% block body %}
      <h2>DEMO</h2>

<form action="/ai" method="GET">
    <div class="mb-3">
        <label for="question" class="form-label">INPUT TEXT</label>
        <input type="text" name="question" class="form-control" id="question" aria-describedby="emailHelp" value="{{ user_input }}">

        <label for="response" class="form-label">RESPONSE</label>
        <input type="text" name="response" class="form-control" id="response" aria-describedby="emailHelp" value="{{ gpt_response }}" >
    </div>
    <button type="submit" class="btn btn-dark">Search</button>
    <a href="/" type="button" class="btn btn-dark">Back</a>
</form>

{% endblock body %}
